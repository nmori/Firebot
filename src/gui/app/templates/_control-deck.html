<firebot-item-table
    ng-if="controlDeckEnabled()"
    items="controlDeckService.decks"
    headers="headers"
    add-new-button-text="新規デッキ"
    on-add-new-clicked="controlDeckService.showAddEditDeckModal()"
    context-menu-options="deckOptions(item)"
    no-data-message="コントロールデッキはまだありません。作成してみましょう！"
    none-found-message="コントロールデッキが見つかりません。"
    search-placeholder="コントロールデッキを検索"
>
    <fb-item-table-toolbar>
        <div class="flex">
            <firebot-button
                text="設定"
                ng-click="controlDeckService.showSettingsModal()"
                icon="far fa-cog"
            />
            <div class="ml-4">
                <firebot-button
                    type="default-outlined"
                    ng-click="controlDeckService.showQRCodeModal()"
                    icon="far fa-qrcode"
                    tooltip="モバイルデバイスを接続するためのQRコードを表示"
                />
            </div>
        </div>
    </fb-item-table-toolbar>
</firebot-item-table>
<div
    ng-if="!controlDeckEnabled()"
    class="flex flex-column items-center justify-center gap-4 p-4 h-full"
>
    <i class="fal fa-grip-horizontal text-7xl"></i>
    <h2 class="text-5xl m-0 font-black">コントロールデッキ</h2>
    <p class="text-center px-96">スマートフォン、タブレット、ブラウザーを Firebot のワイヤレスなコントロールデッキにできます。カスタマイズ可能なボタンのグリッドから、演出を実行して配信を操作できます。有効にして始めましょう。</p>
    <firebot-button
        text="有効にする"
        type="primary"
        ng-click="enableControlDeck()"
    />
</div>
